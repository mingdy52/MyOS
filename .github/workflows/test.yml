name: test

# main으로 푸시하거나 main을 향한 PR이 올라올 때마다 단위 테스트를 돌린다.
# 테스트 대상은 순수 로직(model-router: 모델 라우팅 / notion/filters: 노션 필터 조각)이라
# 노션·Anthropic 키가 필요 없다 → 시크릿 없이 빠르고 안정적으로 돈다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 깃허브 화면에서 수동으로도 돌려볼 수 있게 한다.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 타입도 회귀로 지킨다: 리팩터가 타입을 깨면 여기서 막힌다.
      - run: npx tsc --noEmit

      # Node 내장 테스트 러너(node:test)를 tsx 로더로 돌린다. 새 의존성 없음.
      - run: npm test
