name: weekly-report

# 매주 월요일 오전 9시(KST)에 전주(지난주 월~일) 주간 리포트를 생성한다.
# GitHub의 cron은 UTC 기준이라, 월요일 09:00 KST = 월요일 00:00 UTC 로 적는다.
# (cron 형식: 분 시 일 월 요일 / 요일 1 = 월요일)
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: # 깃허브 화면에서 수동으로도 돌려볼 수 있게 한다.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # 스키마는 부모 페이지에서 동적으로 발견한다. 러너엔 캐시(.cache)가 없으니
          # 매 실행마다 이 페이지를 훑어 DB들의 dataSourceId·컬럼을 채운다.
          # → DB별 DATA_SOURCE_ID 시크릿은 더 이상 필요 없다(이 페이지 id 하나면 됨).
          NOTION_DATA_PAGE_ID: ${{ secrets.NOTION_DATA_PAGE_ID }}
